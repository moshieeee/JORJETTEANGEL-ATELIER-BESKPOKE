<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details | Jorjetteangel Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="e-comerce.css" />
  </head>
  <body class="min-h-screen bg-white text-[#171513]">
    <header class="border-b border-[#e5e1da] bg-[#faf9f7]">
      <div
        class="mx-auto flex h-[148px] max-w-[1160px] items-center justify-between px-6 md:px-0"
      >
        <a
          class="text-[12px] text-[#746d66] hover:text-black"
          href="E-commerce.html#catalog"
          >&larr; Back to shop</a
        >
        <a
          class="absolute left-1/2 top-[21px] -translate-x-1/2 whitespace-nowrap font-editorial text-[28px] font-medium leading-none tracking-[0.25em] text-[#0c0907] uppercase md:text-[34px] md:tracking-[0.3em]"
          href="E-commerce.html#home"
          >JORJETTEANGEL</a
        >
        <span
          class="absolute left-1/2 top-[72px] -translate-x-1/2 whitespace-nowrap text-[9px] tracking-[0.42em] text-[#6d665e]"
          >ATELIER BESPOKE</span
        >
        <span class="flex items-center gap-5 text-[12px]">
          <a
            class="text-[#171513] hover:underline"
            href="E-commerce.html#catalog"
            >Shop</a
          >
          <a class="text-[#171513] hover:underline" href="E-commerce.html#bag"
            >Bag (<span data-cart-count>0</span>)</a
          >
        </span>
      </div>
    </header>

    <main class="mx-auto max-w-[1160px] px-6 py-12 md:px-0 md:py-16">
      <p class="mb-10 text-[11px] text-[#746d66]" id="product-breadcrumb"></p>
      <div class="product-detail-shell relative">
        <button
          id="product-back-button"
          class="back-button absolute left-4 top-4 z-10"
          type="button"
          aria-label="Go back to previous page"
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M15 18L9 12L15 6"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <section
          class="grid gap-10 pt-12 md:grid-cols-[1fr_0.9fr] md:gap-12 md:pt-10"
          id="product-detail"
        >
          <div
            class="flex min-h-[410px] items-center justify-center border border-[#e5e1da] bg-[#faf9f7] md:min-h-[520px]"
            id="product-image"
          ></div>
          <div class="flex flex-col justify-center">
            <p
              class="mb-3 text-[10px] uppercase tracking-[0.25em] text-[#8b8279]"
              id="product-category"
            ></p>
            <h1
              class="font-editorial text-3xl font-normal md:text-4xl"
              id="product-name"
            ></h1>
            <p class="mt-3 text-[13px] text-[#9a938c]" id="product-sku"></p>
            <p class="mt-7 text-[15px]" id="product-price"></p>
            <p
              class="mt-6 max-w-md text-[13px] leading-relaxed text-[#756d65]"
              id="product-description"
            ></p>
            <fieldset class="mt-8">
              <legend class="text-[11px]">Size</legend>
              <div class="mt-2 flex flex-wrap gap-2" id="size-options">
                <button
                  class="size-option border border-[#bdb7b0] px-4 py-2 text-[11px] transition"
                  data-size="S"
                  type="button"
                >
                  S
                </button>
                <button
                  class="size-option border border-[#bdb7b0] px-4 py-2 text-[11px] transition"
                  data-size="M"
                  type="button"
                >
                  M
                </button>
                <button
                  class="size-option border border-[#bdb7b0] px-4 py-2 text-[11px] transition"
                  data-size="L"
                  type="button"
                >
                  L
                </button>
                <button
                  class="size-option border border-[#bdb7b0] px-4 py-2 text-[11px] transition"
                  data-size="XL"
                  type="button"
                >
                  XL
                </button>
              </div>
            </fieldset>
            <div class="mt-6 hidden" id="custom-sizing-panel"></div>
            <div class="mt-8">
              <label class="text-[11px]" for="product-quantity">Quantity</label>
              <div
                class="mt-2 flex w-[112px] items-center border border-[#bdb7b0]"
              >
                <button
                  class="h-9 w-9 text-[#756d65]"
                  id="quantity-minus"
                  type="button"
                  aria-label="Decrease quantity"
                >
                  &minus;
                </button>
                <input
                  class="quantity-input h-9 w-12 border-x border-[#bdb7b0] bg-white text-center text-[12px] outline-none"
                  id="product-quantity"
                  min="1"
                  type="number"
                  value="1"
                />
                <button
                  class="h-9 w-9 text-[#756d65]"
                  id="quantity-plus"
                  type="button"
                  aria-label="Increase quantity"
                >
                  +
                </button>
              </div>
            </div>
            <button
              class="mt-7 w-full max-w-md bg-[#8b9699] px-6 py-3 text-[12px] text-white transition hover:bg-[#6f7c80]"
              id="add-to-cart"
              type="button"
            >
              Add to Cart
            </button>
            <p
              class="mt-3 text-[11px] text-[#756d65]"
              id="cart-message"
              role="status"
            ></p>
          </div>
        </section>
      </div>
      <section
        class="mt-16 border-t border-[#e5e1da] pt-5 text-[11px] text-[#756d65]"
      >
        Product details are shared with the ready-to-wear catalog.
      </section>
    </main>

    <div
      class="shop-image-viewer"
      id="shop-image-viewer"
      role="dialog"
      aria-modal="true"
      aria-label="Full-size product image"
      hidden
    >
      <button
        class="shop-image-viewer-close"
        data-image-viewer-close
        type="button"
        aria-label="Close full-size image"
      >
        &times;
      </button>
      <img id="shop-image-viewer-image" alt="" />
    </div>

    <script src="../array-algorithms.js"></script>
    <script src="../app-session.js"></script>
    <script src="cart.js"></script>
    <script src="product-detail.js"></script>
  </body>
</html>

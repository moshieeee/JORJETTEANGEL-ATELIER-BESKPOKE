<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Bag | Jorjetteangel Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="e-comerce.css" />
  </head>
  <body class="min-h-screen bg-[#faf9f7] text-[#171513]">
    <header class="border-b border-[#e5e1da] bg-white">
      <div
        class="mx-auto flex h-[148px] max-w-[1160px] items-center justify-between px-6 md:px-0"
      >
        <a
          class="text-[12px] text-[#746d66] hover:text-black"
          href="E-commerce.html#catalog"
          >&larr; Back to shop</a
        >
        <a
          class="absolute left-1/2 top-[21px] -translate-x-1/2 whitespace-nowrap font-editorial text-[28px] font-medium tracking-[0.25em] text-[#0c0907] uppercase md:text-[34px]"
          href="E-commerce.html#home"
          >JORJETTEANGEL</a
        >
        <span class="text-[12px]">Bag (<span data-cart-count>0</span>)</span>
      </div>
    </header>
    <main class="mx-auto max-w-[960px] px-6 py-12 md:px-0 md:py-16">
      <h1 class="font-editorial text-4xl">Shopping bag</h1>
      <div class="mt-10" id="bag-items"></div>
      <div
        class="mt-8 flex items-center justify-between border-t border-[#ded9d1] pt-5"
        id="bag-summary"
      ></div>
    </main>
    <script src="../array-algorithms.js"></script>
    <script src="../app-session.js"></script>
    <script src="cart.js"></script>
    <script src="shopping-bag.js"></script>
  </body>
</html>
